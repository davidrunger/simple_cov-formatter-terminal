name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: bin/rubocop
      - run: bin/rspec
      - name: Upload Code Coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          directory: tmp/simple_cov
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check Ruby Coverage
        uses: davidrunger/check-ruby-coverage@d4a24ec6ee57cb7d202bb14a29e7f60dfe43be23 # v1.0.0
