name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      - run: bin/rubocop
      - run: bin/rspec
      - name: Upload Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: tmp/simple_cov
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check Ruby Coverage
        uses: davidrunger/check-ruby-coverage@d4a24ec6ee57cb7d202bb14a29e7f60dfe43be23 # v1.0.0
